name: Expand GerenteMax source

on:
  push:
    paths:
      - '.bootstrap/READY*'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild project archive
        run: |
          cat .bootstrap/cp_* > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz -C .

      - name: Commit expanded source
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "GerenteMax Publisher"
          git config user.email "suporte@gerentemax.com"
          git add -A
          git commit -m "Publica protótipo GerenteMax v36" || exit 0
          git push
